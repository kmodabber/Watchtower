[project]
name = "watchtower"
version = "0.1.0"
description = "Home network scanner that flags risky settings in plain language"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.7",
    "pyyaml>=6.0",  # rules (C3) and lab inventory (C6)
    "sqlalchemy>=2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff==0.8.6",
    "pytest==8.3.4",
    "httpx>=0.28.1",
]

[project.scripts]
watchtower = "watchtower.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["watchtower*"]

[tool.setuptools.package-data]
"watchtower.store" = ["migrations/script.py.mako"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["lab", "web"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear, UP pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # so tests can import watchtower/ and lab/ when run as plain `pytest`
addopts = "-ra"
markers = [
    "lab: needs the Docker lab running (added in Stage 2, skipped in the unit job)",
]
