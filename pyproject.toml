[project]
name = "watchtower"
version = "0.1.0"
description = "Home network scanner that flags risky settings in plain language"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["ruff==0.8.6", "pytest==8.3.4"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["lab", "web"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear, UP pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "lab: needs the Docker lab running (added in Stage 2, skipped in the unit job)",
]
