[global]
    workgroup = LAB
    server string = NAS
    security = user

    # Planted risk 1: anyone may log in as "anonymous" with any password
    map to guest = Bad User


    # Allow anonymous listing of shares
    restrict anonymous = no


    # Listen on port 445 (SMB) only (Samba usually listens on 139 as well)
    smb ports = 445
    disable netbios = yes


    # Avoid extra services (i.e no printing support)
    load printers = no
    printing = bsd
    printcap name = /dev/null

[public]
    path = /srv/share

    # Planted risk 2: this share accepts guests with no password
    read only = yes
    guest ok = yes
    read only = yes