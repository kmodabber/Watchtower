# Run as a standalone server, not under inetd
listen=YES

# Planted risk: anyone may log in as "anonymous" with any password
anonymous_enable=YES

# No real user accounts, so anonymous is the only way to log in
local_enable=NO

# Read-only access for anonymous users
write_enable=NO
anon_upload_enable=NO
anon_mkdir_write_enable=NO

# Anonymous users land here and cannot see outside of this directory
anon_root=/srv/ftp

# Empty folder vsftpd uses to configure unpriviledged helper processes
secure_chroot_dir=/var/empty


# First line a scanner sees on connect
ftpd_banner=NAS FTP server ready.

#vsftpd's syscall sandboxing is disabled (often fails in containers)
seccomp_sandbox=NO
