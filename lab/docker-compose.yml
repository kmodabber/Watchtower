# Lab v0: Device Emulation on an isolated network
# MACs must match inventory.yaml; IPs are fixed so the lab is predictable; Inventory identifies devices by MAC address, not IP address

name: lab

#Shared settings for the "banner only" devices (socat image). All Linux capabilities are dropped except one needed to bind ports below 1024
x-device: &device
  build: ./shared
  image: lab-device:v0
  restart: unless-stopped
  cap_drop: [ALL]
  cap_add: [NET_BIND_SERVICE]
  

services:
  router:
    <<: *device
    hostname: router
    # dnsmasq starts as root and drops to its own user, so it needs
    # SETUID/SETGID.
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID]
    volumes:
      - ./shared/router:/etc/lab:ro
    networks:
      lab_net:
        ipv4_address: 172.28.0.2
        mac_address: "50:c7:bf:11:00:02"  # vendor OUI (TP-Link)

  camera:
    <<: *device
    hostname: camera
    volumes:
      - ./shared/camera:/etc/lab:ro
    networks:
      lab_net:
        ipv4_address: 172.28.0.3
        mac_address: "c0:56:e3:12:34:56"  # vendor OUI (Hikvision)

  laptop:
    <<: *device
    hostname: laptop
    volumes:
      - ./shared/laptop:/etc/lab:ro
    networks:
      lab_net:
        ipv4_address: 172.28.0.4
        mac_address: "3a:7f:21:9c:44:b1"  # randomised (locally administered)

  printer:
    <<: *device
    hostname: printer
    volumes:
      - ./shared/printer:/etc/lab:ro
    networks:
      lab_net:
        ipv4_address: 172.28.0.6
        mac_address: "00:80:77:55:00:06"  # vendor OUI (Brother)

  smart-tv:
    <<: *device
    hostname: smart-tv
    volumes:
      - ./shared/tv:/etc/lab:ro
    networks:
      lab_net:
        ipv4_address: 172.28.0.8
        mac_address: "f4:f5:d8:88:00:08"  # vendor OUI (Google)

  phone:
    <<: *device
    hostname: phone
    volumes:
      - ./shared/phone:/etc/lab:ro
    networks:
      lab_net:
        ipv4_address: 172.28.0.9
        mac_address: "a6:5e:90:3d:71:c8"  # randomised (locally administered)

  # The NAS has its own image because it needs to run a real FTP server and a real SMB server, not just a banner. The NAS image is based on Alpine Linux, but it installs vsftpd and samba.
  #It does not use the cap_drop settings  
  nas:
    build: ./nas
    image: lab-nas:v0
    hostname: nas
    restart: unless-stopped
    networks:
      lab_net:
        ipv4_address: 172.28.0.5
        mac_address: "00:11:32:33:00:04"  # vendor OUI (Synology)

  # The smart plug has its own image because it needs to run a real MQTT broker, not just a banner. The smart plug image is based on Alpine Linux, but it installs mosquitto.
  smart-plug:
    build: ./plug
    image: lab-plug:v0
    hostname: smart-plug
    restart: unless-stopped
    networks:
      lab_net:
        ipv4_address: 172.28.0.7
        mac_address: "24:0a:c4:77:00:07"  # vendor OUI (Espressif)
  scanner:
    build:
      context: .
      dockerfile: Dockerfile.scanner
    image: watchtower-scanner-dev:local
    profiles: [dev]
    cap_drop: [ALL]
    cap_add: [NET_RAW, NET_ADMIN]
    volumes:
      - ..:/workspace
    working_dir: /workspace
    environment:
      WATCHTOWER_CONFIG: /workspace/lab/watchtower.dev.toml
    networks:
      - lab_net

networks:
  lab_net:
    name: lab_net   # fixed name so the scanner project can join it
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24
