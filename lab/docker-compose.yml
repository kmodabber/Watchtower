# Lab v0: Device Emulation on an isolated network
# MACs must match inventory.yml; IPs are fixed so the lab is predictable; Inventory identifies devices by MAC address, not IP address

name: lab

#Shared settings for the "banner only" devices (socat image). All Linux capabilities are dropped except one needed to bind ports below 1024
x-device: &device
  build: ./devices
  image: lab-device:v0
  restart: unless-stopped
  cap_drop: [ALL]
  cap_add: [NET_BIND_SERVICE]
  

services:
  router:
    <<: *device
    hostname: router
    volumes:
      - ./devices/router/services.txt:/etc/lab/services.txt:ro
    networks:
      lab_net:
        ipv4_address: 172.28.0.2
        mac_address: "50:c7:bf:11:00:02"  # vendor OUI (TP-Link)

  camera:
    <<: *device
    hostname: camera
    volumes:
      - ./devices/camera/services.txt:/etc/lab/services.txt:ro
    networks:
      lab_net:
        ipv4_address: 172.28.0.3
        mac_address: "c0:56:e3:12:34:56"  # vendor OUI (TP-Link)

  laptop:
    <<: *device
    hostname: laptop
    volumes:
      - ./devices/laptop/services.txt:/etc/lab/services.txt:ro
    networks:
      lab_net:
        ipv4_address: 172.28.0.4
        mac_address: "3a:7f:21:9c:44:b1"  # randomised (locally administered)

  # The NAS has its own image because it needs to run a real FTP server and a real SMB server, not just a banner. The NAS image is based on Alpine Linux, but it installs vsftpd and samba.
  #It does not use the cap_drop settings  
  nas:
    build: ./nas
    image: lab-nas:v0
    hostname: nas
    restart: unless-stopped
    networks:
      lab_net:
        ipv4_address: 172.28.0.5
        mac_address: "00:11:32:33:00:04"  # vendor OUI (Synology)

networks:
  lab_net:
    name: lab_net   # fixed name so the scanner project can join it
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24
