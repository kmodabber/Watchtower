# WT-93: CI skeleton. Runs lint and unit tests on every pull request and on main.
# WT-54: The lab test (start the lab, scan it, compare with inventory.yaml) 
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # same as lab/Dockerfile.scanner

      - name: Install tools
        # The project itself (FastAPI, SQLAlchemy, Alembic...) plus the dev tools.
        run: python -m pip install -e . "ruff==0.8.6" "pytest==8.3.4" "httpx>=0.28.1"

      - name: Lint (ruff)
        run: ruff check --output-format=github .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Unit tests (pytest)
        run: pytest -m "not lab"
        
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Start the lab
        run: docker compose -f lab/docker-compose.yml up -d --build

      - name: Build the scanner image (local only, never pushed)
        run: docker compose -f lab/docker-compose.yml --profile dev build scanner

      - name: Wait for services
        run: sleep 20

      - name: Lab test (inside the scanner container)
        # The repo is mounted at /workspace, not installed in the image
        run: >
          docker compose -f lab/docker-compose.yml --profile dev run --rm -T
          scanner python -m pytest tests/test_lab.py -m lab -v

      - name: Logs on failure
        if: failure()
        run: docker compose -f lab/docker-compose.yml --profile dev logs

      - name: Stop the lab
        if: always()
        run: docker compose -f lab/docker-compose.yml --profile dev down --remove-orphans
