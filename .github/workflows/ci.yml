# WT-93: CI skeleton. Runs lint and unit tests on every pull request and on main.
# The lab test (start the lab, scan it, compare with inventory.yaml) joins in
# Stage 2 as its own job (WT-FR-03, Fatima).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # same as lab/Dockerfile.scanner

      - name: Install tools
        # The project itself (FastAPI, SQLAlchemy, Alembic...) plus the dev tools.
        run: python -m pip install -e . "ruff==0.8.6" "pytest==8.3.4" "httpx>=0.28.1"

      - name: Lint (ruff)
        run: ruff check --output-format=github .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Unit tests (pytest)
        run: pytest
