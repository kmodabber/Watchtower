- id: RF-TELNET
  title: Telnet is open
  severity: high            # high | medium | low | info
  match: { port: 23 }       # or service, product, version_below
  explanation: Telnet sends passwords without encryption, so anyone on the network can read them.
  fix: Turn off Telnet in the device's settings. Use the app or web page instead.
  references: []